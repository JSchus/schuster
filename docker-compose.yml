# Local development services:
#   postgres — stands in for Neon
#   s3       — moto's S3 emulator, stands in for AWS S3 (in-memory: objects
#              vanish when the container restarts; run `pnpm dev:s3` again)
#
#   docker compose up -d && pnpm dev:s3
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: schuster
      POSTGRES_PASSWORD: schuster
      POSTGRES_DB: schuster
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  s3:
    image: motoserver/moto:5.2.4
    ports: ["5055:5000"]

volumes:
  pgdata:
